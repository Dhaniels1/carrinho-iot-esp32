name: Verificar codigo do carrinho

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Validar sincronizacao da interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text(encoding="utf-8")
          cabecalho = Path("firmware/carrinho/pagina.h").read_text(encoding="utf-8")
          embutido = re.search(r'R"CARRINHOHTML\(\n(.*?)\n\)CARRINHOHTML";', cabecalho, re.S)
          assert embutido and html == embutido.group(1), "A pagina embutida difere de web/index.html"
          script = re.search(r'<script>\n(.*?)\n</script>', html, re.S)
          assert script, "Script da interface nao encontrado"
          Path("/tmp/carrinho-painel.js").write_text(script.group(1), encoding="utf-8")
          PY
          node --check /tmp/carrinho-painel.js

      - name: Verificar interface independente da etapa 04
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pasta = Path("etapas/04-interface-web/carrinho_web")
          html = (pasta / "pagina.html").read_text(encoding="utf-8")
          cabecalho = (pasta / "pagina.h").read_text(encoding="utf-8")
          embedded = re.search(r'R"ETAPA04HTML\(\n(.*?)\n\)ETAPA04HTML";', cabecalho, re.S)
          assert embedded and embedded.group(1) == html, "Etapa 04: pagina.h diverge de pagina.html"
          script = re.search(r'<script>\n(.*?)\n</script>', html, re.S)
          assert script, "Etapa 04: JavaScript ausente"
          Path("/tmp/carrinho-etapa04.js").write_text(script.group(1), encoding="utf-8")
          PY
          node --check /tmp/carrinho-etapa04.js

      - name: Preparar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar placa ESP32
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compilar firmware do carrinho e controle
        run: |
          cp firmware/carrinho/secrets.h.example firmware/carrinho/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 firmware/carrinho
          arduino-cli compile --fqbn esp32:esp32:esp32 firmware/controle

      - name: Compilar exemplos independentes das etapas
        run: |
          cp etapas/03-controle-wifi/servidor_basico/secrets.h.example etapas/03-controle-wifi/servidor_basico/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 etapas/01-testes-iniciais/serial_basico
          arduino-cli compile --fqbn esp32:esp32:esp32 etapas/02-motores/teste_motores
          arduino-cli compile --fqbn esp32:esp32:esp32 etapas/02-motores/teste_farois
          arduino-cli compile --fqbn esp32:esp32:esp32 etapas/03-controle-wifi/servidor_basico
          arduino-cli compile --fqbn esp32:esp32:esp32 etapas/03-controle-wifi/cliente_basico

      - name: Compilar carrinho web da etapa 04
        run: |
          cp etapas/04-interface-web/carrinho_web/secrets.h.example etapas/04-interface-web/carrinho_web/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 etapas/04-interface-web/carrinho_web
