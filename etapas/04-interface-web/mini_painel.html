<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primeiro painel do carrinho — exemplo</title>
<style>
body{font:16px system-ui;margin:2rem auto;max-width:550px;padding:0 1rem;color:#202b3e}
button{padding:1rem;margin:.3rem;border:1px solid #526a89;background:#edf3fa;border-radius:8px;cursor:pointer}
#estado{font-weight:700}button:focus-visible{outline:3px solid #f69e00}
</style></head>
<body>
<h1>Painel básico (exemplo didático)</h1>
<p>Esta página explica como eventos de botões se transformam em comandos. Não controla motores.</p>
<div aria-label="Comandos simulados">
<button data-comando="frente">Frente</button><button data-comando="re">Ré</button>
<button data-comando="esquerda">Esquerda</button><button data-comando="direita">Direita</button>
<button data-comando="acelerar">Acelerar</button><button data-comando="desacelerar">Desacelerar</button>
<button data-comando="parar">PARAR</button>
</div>
<p id="estado" role="status">Comando simulado: parar</p>
<script>
document.querySelectorAll("[data-comando]").forEach(botao=>{
  botao.addEventListener("click",()=>{
    document.getElementById("estado").textContent=
      "Comando simulado: "+botao.dataset.comando;
  });
});
</script>
</body>
</html>
